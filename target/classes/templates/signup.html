<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSK Messaging | Sign up</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/css/portal.css"></head><body class="auth"><main class="auth-card wide"><img class="brand-logo" src="/images/ksk-logo.png"><div class="eyebrow">GET STARTED WITH KSK</div><h1>Create your business account</h1><p class="muted">Your business workspace is isolated from other accounts.</p><div class="alert" th:if="${error}" th:text="${error}"></div><form method="post" action="/signup"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><div><label>Business name</label><input name="businessName" required maxlength="120"></div><div><label>Contact person</label><input name="contactName" required maxlength="100"></div><div><label>Business email</label><input name="email" type="email" required></div><div><label>Phone number</label><input name="phone" required placeholder="919876543210"></div><div class="span2"><label>Password (minimum 10 characters)</label><input name="password" type="password" minlength="10" required></div></div><button class="btn primary full">Create account</button></form><p class="auth-foot">Already registered? <a href="/login">Sign in</a></p></main></body></html>
