<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSK Messaging | Login</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/css/portal.css"></head><body class="auth"><main class="auth-card"><img class="brand-logo" src="/images/ksk-logo.png"><div class="eyebrow">BUSINESS MESSAGING PLATFORM</div><h1>Welcome back</h1><p class="muted">Sign in to manage your WhatsApp campaigns.</p><div class="alert" th:if="${param.error}">Invalid email or password.</div><div class="success" th:if="${param.registered}">Account created. You can now sign in.</div><div class="success" th:if="${param.logout}">You have been logged out.</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Email address</label><input name="username" type="email" required autocomplete="username" placeholder="you@company.com"><label>Password</label><input name="password" type="password" required autocomplete="current-password" placeholder="Your password"><button class="btn primary full">Sign in</button></form><p class="auth-foot">New to KSK? <a href="/signup">Create a business account</a></p></main></body></html>
